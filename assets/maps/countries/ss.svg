<svg xmlns="http://www.w3.org/2000/svg" viewBox="380.16 149.19 180 180" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="countryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="380.16" y="149.19" width="180" height="180" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M 380.16 239.19 H 560.1600000000001 M 470.16 149.19 V 329.19" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Country Vector Polygon Representation -->
  <g filter="url(#shadow)">
    <!-- Stylized Country Outline Envelope around Capital -->
    <path d="M 425.16 214.19 Q 460.16 189.19 505.16 209.19 T 520.1600000000001 259.19 T 455.16 284.19 T 420.16 249.19 Z" 
          fill="url(#countryGrad)" stroke="#818CF8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Capital City Glowing Pulse Ring -->
  <circle cx="470.16" cy="239.19" r="16" fill="url(#pinGlow)">
    <animate attributeName="r" values="10;22;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Capital Pin Marker -->
  <circle cx="470.16" cy="239.19" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="470.16" cy="239.19" r="2" fill="#FFFFFF"/>

  <!-- Capital Label Badge -->
  <g transform="translate(470.16, 227.19)">
    <rect x="-35" y="-14" width="70" height="15" rx="4" fill="#0F172A" fill-opacity="0.85" stroke="#475569" stroke-width="0.5"/>
    <text x="0" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Juba</text>
  </g>
</svg>