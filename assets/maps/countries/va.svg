<svg xmlns="http://www.w3.org/2000/svg" viewBox="337.67 57.25999999999999 180 180" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="countryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="337.67" y="57.25999999999999" width="180" height="180" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M 337.67 147.26 H 517.6700000000001 M 427.67 57.25999999999999 V 237.26" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Country Vector Polygon Representation -->
  <g filter="url(#shadow)">
    <!-- Stylized Country Outline Envelope around Capital -->
    <path d="M 382.67 122.25999999999999 Q 417.67 97.25999999999999 462.67 117.25999999999999 T 477.67 167.26 T 412.67 192.26 T 377.67 157.26 Z" 
          fill="url(#countryGrad)" stroke="#818CF8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Capital City Glowing Pulse Ring -->
  <circle cx="427.67" cy="147.26" r="16" fill="url(#pinGlow)">
    <animate attributeName="r" values="10;22;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Capital Pin Marker -->
  <circle cx="427.67" cy="147.26" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="427.67" cy="147.26" r="2" fill="#FFFFFF"/>

  <!-- Capital Label Badge -->
  <g transform="translate(427.67, 135.26)">
    <rect x="-35" y="-14" width="70" height="15" rx="4" fill="#0F172A" fill-opacity="0.85" stroke="#475569" stroke-width="0.5"/>
    <text x="0" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Vatican City</text>
  </g>
</svg>