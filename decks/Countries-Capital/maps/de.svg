<svg xmlns="http://www.w3.org/2000/svg" viewBox="339.79 22.36 180 180" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="countryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="339.79" y="22.36" width="180" height="180" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M 339.79 112.36 H 519.79 M 429.79 22.36 V 202.36" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Country Vector Polygon Representation -->
  <g filter="url(#shadow)">
    <!-- Stylized Country Outline Envelope around Capital -->
    <path d="M 384.79 87.36 Q 419.79 62.36 464.79 82.36 T 479.79 132.36 T 414.79 157.36 T 379.79 122.36 Z" 
          fill="url(#countryGrad)" stroke="#818CF8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Capital City Glowing Pulse Ring -->
  <circle cx="429.79" cy="112.36" r="16" fill="url(#pinGlow)">
    <animate attributeName="r" values="10;22;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Capital Pin Marker -->
  <circle cx="429.79" cy="112.36" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="429.79" cy="112.36" r="2" fill="#FFFFFF"/>

  <!-- Capital Label Badge -->
  <g transform="translate(429.79, 100.36)">
    <rect x="-35" y="-14" width="70" height="15" rx="4" fill="#0F172A" fill-opacity="0.85" stroke="#475569" stroke-width="0.5"/>
    <text x="0" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Berlin</text>
  </g>
</svg>