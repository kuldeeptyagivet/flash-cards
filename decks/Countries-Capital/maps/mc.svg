  <!-- Real Capital Location Marker -->
  <circle cx="416.5" cy="141.7" r="3.5999999999999996" fill="#EF4444" fill-opacity="0.35">
    <animate attributeName="r" values="2.4;4.8;2.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="416.5" cy="141.7" r="1.2" fill="#EF4444" stroke="#FFFFFF" stroke-width="0.6"/>
</svg>