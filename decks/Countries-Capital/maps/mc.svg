<svg xmlns="http://www.w3.org/2000/svg" viewBox="386.50 111.70 60.00 60.00" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_mc" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="realCountryGrad_mc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow_mc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="386.50" y="111.70" width="60.00" height="60.00" fill="url(#bgGrad_mc)"/>
  
  <!-- Real Geographic Country Polygon -->
  <g filter="url(#shadow_mc)">
    <path d="M 396.5 131.7 L 436.5 131.7 L 426.5 161.7 L 401.5 156.7 Z" fill="url(#realCountryGrad_mc)" stroke="#818CF8" stroke-width="0.8" stroke-linejoin="round"/>
